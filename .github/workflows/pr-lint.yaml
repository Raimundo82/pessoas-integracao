name: pull-request-lint
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited
jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |-
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            test
          requireScope: false
          githubBaseUrl: ${{ github.api_url }}
