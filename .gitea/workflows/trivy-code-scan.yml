name: Trivy Code Security Scan

on:
  pull_request:
    branches:
      - master

env:
  RUNNER_TOOL_CACHE: /toolcache

jobs:
  trivy-scan:
    name: Trivy Code Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore .NET
        run: |
          dotnet restore
          echo "=== Lock files generated ==="
          find . -name "packages.lock.json"

      - name: Debug workspace
        run: |
          echo "PWD: $(pwd)"
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          find . -name "*.csproj" | head -10

      - name: Run Trivy vulnerability scanner
        run: |
          docker create --name trivy-scan \
            aquasec/trivy:0.68.2 \
            fs \
              --scanners vuln,secret \
              --severity CRITICAL,HIGH \
              --dependency-tree \
              --skip-dirs bin,obj,.git \
              --ignore-unfixed \
              --exit-code 1 \
              --timeout 10m \
              /work

          docker cp $GITHUB_WORKSPACE/. trivy-scan:/work
          docker start --attach trivy-scan
          EXIT_CODE=$?
          docker rm -f trivy-scan
          exit $EXIT_CODE
