name: Trivy Code Security Scan

on:
  pull_request:
    branches:
      - master

env:
  RUNNER_TOOL_CACHE: /toolcache

jobs:
  trivy-scan:
    name: Trivy Code Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore .NET
        run: |
          dotnet restore
          echo "=== Lock files generated ==="
          find . -name "packages.lock.json"

      - name: Debug workspace
        run: |
          echo "PWD: $(pwd)"
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          find . -name "*.csproj" | head -10

      - name: Run Trivy vulnerability scanner
        run: |
          docker run --rm \
            -e HTTP_PROXY -e HTTPS_PROXY -e NO_PROXY \
            -e http_proxy -e https_proxy -e no_proxy \
            --volumes-from $(cat /proc/1/cpuset | cut -d/ -f3) \
            -w $GITHUB_WORKSPACE \
            aquasec/trivy:0.68.2 \
            fs \
              --scanners vuln,secret \
              --severity CRITICAL,HIGH \
              --dependency-tree \
              --skip-dirs bin,obj,.git \
              --ignore-unfixed \
              --exit-code 1 \
              --timeout 10m \
              .
