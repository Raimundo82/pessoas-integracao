name: Trivy Code Security Scan

on:
  pull_request:
    branches:
      - master

env:
  RUNNER_TOOL_CACHE: /toolcache

jobs:
  trivy-scan:
    name: Trivy Code Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.10.x'

      - name: Install dependencies
        run: npm ci

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore .NET
        run: dotnet restore

      - name: Run Trivy vulnerability scanner (Docker)
        run: |
          docker run --rm \
            -e HTTP_PROXY -e HTTPS_PROXY -e NO_PROXY \
            -e http_proxy -e https_proxy -e no_proxy \
            -v "$PWD:/work" \
            -w /work \
            aquasec/trivy:0.68.2 \
            fs \
              --scanners vuln \
              --severity CRITICAL,HIGH \
              --dependency-tree \
              --file-patterns ".*\.csproj"
              --exit-code 1 \
              --timeout 10m \
              .
