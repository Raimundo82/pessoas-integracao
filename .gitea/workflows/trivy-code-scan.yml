name: Trivy Code Security Scan

on:
  pull_request:
    branches:
      - master

env:
  RUNNER_TOOL_CACHE: /toolcache

jobs:
  trivy-scan:
    name: Trivy Code Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner
        run: |
          docker rm -f trivy-scan 2>/dev/null || true
          docker create --name trivy-scan \
            aquasec/trivy:0.68.2 \
            fs \
              --scanners vuln,secret \
              --severity CRITICAL,HIGH \
              --dependency-tree \
              --skip-dirs bin,obj,.git \
              --ignore-unfixed \
              --exit-code 1 \
              --timeout 10m \
              /work

          docker cp $GITHUB_WORKSPACE/. trivy-scan:/work
          docker start --attach trivy-scan
          EXIT_CODE=$?
          docker rm -f trivy-scan
          exit $EXIT_CODE
