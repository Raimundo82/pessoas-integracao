name: Security SCA Scan

on:
  pull_request:
    branches:
      - master

env:
  RUNNER_TOOL_CACHE: /toolcache

jobs:
  trivy-scan:
    name: Trivy Code Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.70.0

      - name: Run Trivy vulnerability scanner
        run: |
          trivy fs \
            --scanners vuln,secret \
            --severity CRITICAL,HIGH \
            --dependency-tree \
            --skip-dirs bin,obj,.git \
            --ignore-unfixed \
            --exit-code 1 \
            --timeout 10m \
            .

  snyk-scan:
    name: Snyk Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Setup Snyk
        uses: snyk/actions/setup@master

      - name: Run Snyk vulnerability scanner
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --all-projects \
            --severity-threshold=high \
            --fail-on=upgradable \
            --show-vulnerable-paths=all

  notify-success:
    name: All Scans Passed
    runs-on: ubuntu-latest
    needs: [trivy-scan, snyk-scan]
    if: success()
    steps:
      - run: echo "✅ No HIGH or CRITICAL vulnerabilities found!"
