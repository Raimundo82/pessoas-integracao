name: Security SCA Scan

on:
  pull_request:
    branches:
      - master

jobs:
  trivy-scan:
    name: Trivy Code Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          token-setup-trivy: ${{ secrets.GH_PAT }}
          scanners: 'vuln,secret'
          severity: 'MEDIUM,CRITICAL,HIGH'
          skip-dirs: 'bin,obj,.git'
          ignore-unfixed: 'true'
          timeout: '10m'
          exit-code: '1'

  snyk-scan:
    name: Snyk Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache .NET SDK
        uses: actions/cache@v6
        with:
          path: /usr/share/dotnet
          key: ${{ runner.os }}-dotnet-sdk-${{ hashFiles('global.json') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-sdk-

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Setup Snyk
        uses: snyk/actions/setup@master

      - name: Run Snyk vulnerability scanner
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --all-projects \
            --severity-threshold=high \
            --fail-on=upgradable \
            --show-vulnerable-paths=all

  notify-success:
    name: All Scans Passed
    runs-on: ubuntu-latest
    needs: [trivy-scan, snyk-scan]
    if: success()
    steps:
      - run: echo "✅ No HIGH or CRITICAL vulnerabilities found!"
