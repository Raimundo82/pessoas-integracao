name: Snyk Dependency Security Scan

on:
  pull_request:
    branches:
      - master

jobs:
  snyk-scan:
    name: Snyk Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Snyk
        uses: snyk/actions/setup@master

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Snyk test for .NET and npm
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --all-projects --severity-threshold=high --fail-on=upgradable
          echo "✅ No HIGH or CRITICAL upgradable vulnerabilities found in dependencies!"
