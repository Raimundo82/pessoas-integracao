name: Lint, Build and Test

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.SSH_KEY }}
          ssh-known-hosts: ${{ vars.SSH_KNOWN_HOSTS }}

      - name: Inspect tool cache
        run: |
          echo "RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          ls -la /toolcache || true
          find /toolcache -maxdepth 4 -type d 2>/dev/null | sort | head -100

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.10.x'

      - name: Install dependencies
        run: npm ci

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Inspect tool cache after setup
        run: |
          echo "RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
          find /toolcache -maxdepth 5 -type d 2>/dev/null | sort | head -200
          dotnet --info

      - name: Format code
        run: dotnet format --verify-no-changes

      - name: Build (No incremental)
        run: dotnet build --no-incremental

      - name: Check for vulnerable NuGet packages
        run: dotnet list package --vulnerable --include-transitive --no-restore

      - name: Test with dotnet CLI
        run: dotnet test --no-build
