services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ../..:/workspaces:cached
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      ConnectionStrings__DefaultConnection: 'Host=localhost;Database=${DB_NAME};Username=postgres;Password=${DB_PASSWORD}'
      AppSettings__SubPath: ${APP_SUB_PATH}
      AppSettings__ReadApiKey: ${READ_API_KEY}
      AppSettings__WriteApiKey: ${WRITE_API_KEY}
      SONARQUBE_CI_TOKEN: ${SONARQUBE_CI_TOKEN}
      SONAR_HOST_URL: ${SONAR_HOST_URL}

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    network_mode: service:db

    # Uncomment to connect as root instead. More info: https://aka.ms/dev-containers-non-root.
    # user: root

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  db:
    image: postgres:17
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: ${DB_NAME}

    # Add "forwardPorts": ["5432"] to **devcontainer.json** to forward PostgreSQL locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

volumes:
  postgres-data:
