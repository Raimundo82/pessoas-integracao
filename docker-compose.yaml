version: "3.8"

services:
  db:
    image: postgres:17
    container_name: rh-stagging-db
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - rhstagging-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rh-stagging-db
    restart: always
    depends_on:
      - db
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=postgres;Username=postgres;Password=postgres
    ports:
      - "8080:8080"
    networks:
      - rhstagging-network

volumes:
  db_data:

networks:
  rhstagging-network:
