pre-commit:
  parallel: true
  commands:
    prettier:
      stage_fixed: true
      glob: '**/*.{md,mdx,yml,yaml,json,jsonc}'
      run: npx prettier --write --no-error-on-unmatched-pattern {staged_files}
    dotnet-format:
      stage_fixed: true
      glob: '**/*.cs'
      run: dotnet format whitespace --include {staged_files} && dotnet format style --include {staged_files}
format-all:
  commands:
    prettier:
      glob: '**/*.{md,mdx,yml,yaml,json,jsonc}'
      run: npx prettier --write {all_files}
    dotnet:
      run: dotnet format whitespace && dotnet format style
format-ci:
  commands:
    prettier:
      glob: '**/*.{md,mdx,yml,yaml,json,jsonc}'
      run: npx prettier --check {all_files}
    dotnet:
      run: dotnet format whitespace --verify-no-changes && dotnet format style --verify-no-changes
